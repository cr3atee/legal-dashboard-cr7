name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable EXE
        run: npm run dist:work:no-map
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Legal-Dashboard-Windows-1.0.1
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
