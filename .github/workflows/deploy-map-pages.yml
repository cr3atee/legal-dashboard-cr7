name: Deploy Standalone Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "external/your-map-source/**"
      - ".github/workflows/deploy-map-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: external/your-map-source/package-lock.json

      - name: Install dependencies
        working-directory: external/your-map-source
        run: npm ci

      - name: Build static map for GitHub Pages
        working-directory: external/your-map-source
        run: npm run build -- --base=/legal-dashboard-cr7/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: external/your-map-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
